name: Deploy agent-starter

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Deploy Cloudflare agent Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare deployment credential
        id: credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: add the CLOUDFLARE_API_TOKEN repository secret to enable automatic deployment."
          fi

      - name: Check out tested commit
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Deploy to Cloudflare Workers
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6d121e7041ead643e98f3562a9866c0a"
          command: deploy

      - name: Deploy main website Worker with private research RPC
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6d121e7041ead643e98f3562a9866c0a"
        run: node scripts/deploy-website-worker.mjs

      - name: Deploy internal service hub
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6d121e7041ead643e98f3562a9866c0a"
          command: deploy --config wrangler.hub.jsonc

      - name: Deploy nationwide probate research Worker
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6d121e7041ead643e98f3562a9866c0a"
          command: deploy --config wrangler.scraper.jsonc

      - name: Verify production service hub and all downstream Workers
        if: steps.credentials.outputs.available == 'true'
        run: |
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused https://theintro2society.org/__hub/check)"
          echo "$response"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const required = ["agentStarter", "probatePortal", "communityBlackboard", "probateScraper"];
            const failed = required.filter((name) => body.services?.[name]?.ok !== true || body.services[name]?.status !== 200);
            if (body.ok !== true || failed.length) {
              console.error("Production service health check failed:", failed.join(", ") || "overall status is not healthy");
              process.exit(1);
            }
            console.log("All four production services returned HTTP 200.");
          ' "$response"

      - name: Smoke test nationwide probate public-web research
        if: steps.credentials.outputs.available == 'true'
        run: |
          page="$(curl --fail --silent --show-error --max-time 30 https://scraper.theintro2society.org/)"
          echo "$page" | grep -q "Search current public probate sources"
          payload='{"estate":"Virginia probate court","state":"Virginia","county":"Richmond City","keywords":"official case search public records"}'
          response="$(curl --fail --silent --show-error --max-time 120 -H 'Content-Type: application/json' --data "$payload" https://scraper.theintro2society.org/api/research)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const sources = Array.isArray(body.sources) ? body.sources : [];
            const urls = sources.filter((source) => typeof source.url === "string" && source.url.startsWith("https://"));
            if (urls.length === 0) {
              console.error("Nationwide probate research returned no usable public-web sources.");
              console.error(JSON.stringify(body).slice(0, 1000));
              process.exit(1);
            }
            console.log("Nationwide probate research returned", urls.length, "public-web source(s).");
          ' "$response"

      - name: Smoke test main website AI chat with live web sources
        if: steps.credentials.outputs.available == 'true'
        run: |
          payload='{"messages":[{"role":"user","content":"Find current official Cloudflare Browser Run or Browser Rendering documentation. Explain what it does briefly and include direct source URLs."}]}'
          response="$(curl --fail --silent --show-error --max-time 120 -H 'Content-Type: application/json' --data "$payload" https://theintro2society.org/api/chat)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const answer = body.choices?.[0]?.message?.content ?? "";
            const urls = [...answer.matchAll(/https?:\/\/[^\s)]+/g)].map((match) => match[0]);
            if (answer.length < 40 || urls.length === 0) {
              console.error("Main website AI chat did not return a usable answer with source URLs.");
              console.error(answer.slice(0, 1000));
              process.exit(1);
            }
            console.log("Main website AI chat returned a response with source URLs:", urls.slice(0, 3));
          ' "$response"

      - name: Smoke test main website image generation with live web references
        if: steps.credentials.outputs.available == 'true'
        run: |
          payload='{"model":"flux","stream":false,"messages":[{"role":"user","content":"Create a clean square editorial icon of a magnifying glass over a small globe, white background, crisp vector-like style."}]}'
          response="$(curl --fail --silent --show-error --max-time 180 -H 'Content-Type: application/json' --data "$payload" https://theintro2society.org/v1/chat/completions)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const content = body.choices?.[0]?.message?.content ?? "";
            const match = content.match(/!\[Image\]\((https:\/\/[^)]+)\)/);
            if (!match) {
              console.error("Main website image generation did not return an image URL.");
              console.error(content.slice(0, 1000));
              process.exit(1);
            }
            fetch(match[1]).then((image) => {
              if (!image.ok || !image.headers.get("content-type")?.startsWith("image/")) {
                console.error("Generated image could not be retrieved:", image.status);
                process.exit(1);
              }
              console.log("Main website image generation returned a retrievable image:", image.status, image.headers.get("content-type"));
            }).catch((error) => {
              console.error("Generated image retrieval failed:", error);
              process.exit(1);
            });
          ' "$response"
