name: Live website smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/live-website-smoke.mjs"
      - ".github/workflows/live-website-smoke.yml"

permissions:
  contents: read

jobs:
  website:
    name: Test live chat, web research, and image generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test production website endpoints
        run: node scripts/live-website-smoke.mjs
