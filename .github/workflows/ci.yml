name: CI

on:
  push:
    branches:
      - main
      - repair/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript, lint, format, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatting
        run: npx oxfmt --write .

      - name: Run project checks
        run: npm run check

      - name: Run memory worker tests
        run: npm run test:memory

      - name: Run chat tests
        run: npm run test:chat

      - name: Build application
        run: npx vite build
