name: CI

on:
  push:
    branches:
      - main
      - repair/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript, lint, format, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          if [ -s npm-audit.json ]; then
            node -e 'const r=require("./npm-audit.json"); console.log("Audit totals:", JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(r.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via ?? []).map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));'
          else
            echo "No npm audit report was produced."
          fi

      - name: Apply repository formatting
        run: npx oxfmt --write .

      - name: Run project checks
        run: npm run check

      - name: Run memory worker tests
        run: npm run test:memory

      - name: Build application
        run: npx vite build
